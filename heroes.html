<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Герои Marvel — каталог</title>
  <link rel="stylesheet" href="./heroes.css">
  <script type="module" src="./heroes.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="back-link" href="./index.html">← К заданию AJAX</a>
      <p class="eyebrow">Бонусное задание</p>
      <h1>Герои Marvel</h1>
      <p class="intro">Карточки загружаются из JSON. Выберите фильм, чтобы увидеть его героев.</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="filter-control">
        <label for="movie-filter">Фильм</label>
        <select id="movie-filter" disabled>
          <option value="">Все фильмы</option>
        </select>
      </div>
      <p id="result-count" class="result-count" role="status">Загружаем героев…</p>
    </div>
    <p id="load-error" class="load-error" role="alert" hidden></p>
    <div id="hero-cards" class="hero-grid"></div>
  </main>
</body>
</html>
